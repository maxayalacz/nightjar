name: Build Debug APK

on:
  push:
    branches:
      - feat/portal-ui-theme-studio
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK and NDK
        run: |
          if ! command -v sdkmanager &> /dev/null; then
            export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          fi
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;29.0.14206865"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/29.0.14206865" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleNonRootDebug -PabiFilters=arm64-v8a --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightjar-nonroot-arm64-debug-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
